<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roda Kemanusiaan: Spin & Challenge PMR - SMPN 2 Pekuncen</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Plus Jakarta Sans & Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cinzel"', 'serif'],
          },
          colors: {
            pmi: {
              red: '#DC2626',
              dark: '#991B1B',
              gold: '#F59E0B',
              green: '#059669',
              yellow: '#D97706'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Transisi Putaran Roda Halus & Alami */
    #wheel-canvas {
      transition: transform 4.5s cubic-bezier(0.12, 0.95, 0.22, 1);
    }

    /* Cetak Piagam Resmi */
    @media print {
      body * { visibility: hidden; }
      #certificate-wrap, #certificate-wrap * { visibility: visible; }
      #certificate-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 24px;
        box-shadow: none !important;
        border: 5px double #991b1b !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-red-600 selection:text-white">

  <!-- Header Navigasi -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 shadow-xl">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-red-700 to-red-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-red-900/50 border border-red-400/30">
          <i class="fa-solid fa-dharmachakra text-lg"></i>
        </div>
        <div>
          <h1 class="font-black text-white tracking-wider text-sm sm:text-base flex items-center gap-2">
            <span>RODA KEMANUSIAAN</span>
            <span class="text-[10px] bg-red-600/30 text-red-400 border border-red-500/40 px-2 py-0.5 rounded-full font-bold">SPIN & CHALLENGE</span>
          </h1>
          <p class="text-xs text-red-400 font-extrabold tracking-wide">PMR MADYA SMP NEGERI 2 PEKUNCEN</p>
        </div>
      </div>

      <!-- Action Buttons & Stats -->
      <div class="flex items-center gap-3">
        <button onclick="openLeaderboardModal()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
          <i class="fa-solid fa-trophy text-amber-400"></i>
          <span class="hidden sm:inline">Peringkat Sekolah</span>
          <span id="nav-count-badge" class="bg-amber-500 text-slate-950 text-[10px] px-1.5 py-0.2 rounded-full font-black">...</span>
        </button>

        <div id="top-bar-stats" class="hidden sm:flex items-center gap-4 bg-slate-800/80 px-4 py-1.5 rounded-full border border-slate-700 text-xs font-bold">
          <div class="flex items-center gap-1.5 text-amber-400">
            <i class="fa-solid fa-star"></i>
            <span>Poin: <strong id="top-score" class="text-white text-sm font-black">0</strong></span>
          </div>
          <div class="w-1 h-3 bg-slate-700"></div>
          <div class="flex items-center gap-1.5 text-red-400">
            <i class="fa-solid fa-rotate"></i>
            <span>Putaran: <strong id="top-spins" class="text-white text-sm font-black">0</strong></span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 flex flex-col justify-center">

    <!-- ================= 1. REGISTRASI RELAWAN ================= -->
    <section id="screen-register" class="bg-slate-900/90 rounded-3xl p-6 sm:p-10 shadow-2xl border border-slate-800 max-w-lg mx-auto my-auto text-center relative overflow-hidden backdrop-blur-xl">
      <div class="absolute -top-16 -right-16 w-48 h-48 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-16 -left-16 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="relative z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-950/70 border border-red-700/50 text-red-300 text-xs font-black mb-4 uppercase tracking-widest">
          <i class="fa-solid fa-spinner fa-spin text-red-400"></i> Spin Wheel PMR Madya
        </div>

        <h2 class="text-2xl sm:text-3xl font-black text-white mb-2 tracking-tight">Roda Uji Kemanusiaan</h2>
        <p class="text-slate-400 text-xs sm:text-sm mb-6 leading-relaxed">
          Putar roda keberuntungan dan selesaikan 3 jenis kartu tantangan: <strong class="text-emerald-400">Hijau (Teori)</strong>, <strong class="text-amber-400">Kuning (Aksi)</strong>, dan waspadai <strong class="text-rose-400">Merah (Sanksi)</strong>!
        </p>

        <form onsubmit="startSpinGame(event)" class="space-y-4 text-left bg-slate-950/60 p-5 rounded-2xl border border-slate-800">
          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-300 mb-1.5">Nama Relawan / Siswa</label>
            <input type="text" id="reg-name" required placeholder="Tulis nama lengkap Anda"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-red-500 text-sm font-semibold placeholder:text-slate-600" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-black uppercase tracking-wider text-slate-300 mb-1.5">Kelas</label>
              <select id="reg-class" class="w-full px-3 py-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-red-500 text-sm font-semibold">
                <!-- KELAS 7 A - G -->
                <optgroup label="Kelas 7">
                  <option value="7A">Kelas 7A</option>
                  <option value="7B">Kelas 7B</option>
                  <option value="7C">Kelas 7C</option>
                  <option value="7D">Kelas 7D</option>
                  <option value="7E">Kelas 7E</option>
                  <option value="7F">Kelas 7F</option>
                  <option value="7G">Kelas 7G</option>
                </optgroup>
                <!-- KELAS 8 A - G -->
                <optgroup label="Kelas 8">
                  <option value="8A">Kelas 8A</option>
                  <option value="8B">Kelas 8B</option>
                  <option value="8C">Kelas 8C</option>
                  <option value="8D">Kelas 8D</option>
                  <option value="8E">Kelas 8E</option>
                  <option value="8F">Kelas 8F</option>
                  <option value="8G">Kelas 8G</option>
                </optgroup>
                <!-- KELAS 9 A - G -->
                <optgroup label="Kelas 9">
                  <option value="9A">Kelas 9A</option>
                  <option value="9B">Kelas 9B</option>
                  <option value="9C">Kelas 9C</option>
                  <option value="9D">Kelas 9D</option>
                  <option value="9E">Kelas 9E</option>
                  <option value="9F">Kelas 9F</option>
                  <option value="9G">Kelas 9G</option>
                </optgroup>
              </select>
            </div>
            <div>
              <label class="block text-xs font-black uppercase tracking-wider text-slate-300 mb-1.5">Pilihan Regu</label>
              <select id="reg-unit" class="w-full px-3 py-2.5 rounded-xl border border-slate-700 bg-slate-900 text-white focus:outline-none focus:ring-2 focus:ring-red-500 text-sm font-semibold">
                <option value="Laskar Nagasasi">Laskar Nagasasi</option>
                <option value="Rajawali Spendoe">Rajawali Spendoe</option>
                <option value="Garuda Madya">Garuda Madya</option>
              </select>
            </div>
          </div>

          <button type="submit" class="w-full mt-2 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-black py-3.5 px-6 rounded-xl shadow-lg shadow-red-950 transition-all flex items-center justify-center gap-2 group text-sm tracking-wide">
            <span>Masuk ke Arena Roda</span>
            <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
          </button>
        </form>

        <div class="mt-4 flex items-center justify-center gap-2">
          <button type="button" onclick="openLeaderboardModal()" class="text-xs text-amber-400 hover:text-amber-300 font-bold underline underline-offset-4 flex items-center gap-1.5">
            <i class="fa-solid fa-crown text-[11px]"></i> Lihat Papan Peringkat Real-Time
          </button>
        </div>
      </div>
    </section>

    <!-- ================= 2. ARENA SPIN WHEEL & 3 KARTU ================= -->
    <section id="screen-gameplay" class="hidden flex-col gap-6">
      
      <!-- Panel Profil Pemain & Rekap Cepat -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-4 backdrop-blur
